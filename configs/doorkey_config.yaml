# Configuration for Tabular Minigrid DoorKey Domain
domain: "doorkey"
env_name: "doorkey5" # "doorkey5" | "doorkey6" | "doorkey8"

# Environment geometry
environments:
  doorkey5:
    size: 5
    wall_x: 2
    door_pos: [2, 2]
    key_pos: [1, 1]
    start: [1, 3]
    start_dir: 0
    goal: [3, 3]
    horizon: 30
  doorkey6:
    size: 6
    wall_x: 3
    door_pos: [3, 2]
    key_pos: [1, 1]
    start: [1, 4]
    start_dir: 0
    goal: [4, 4]
    horizon: 40
  doorkey8:
    size: 8
    wall_x: 4
    door_pos: [4, 3]
    key_pos: [1, 1]
    start: [1, 6]
    start_dir: 0
    goal: [6, 6]
    horizon: 60

# Budget and search parameters
budget:
  n_rounds: 4 # Strict equal budget across all methods
  eureka_pop: 2 # 2 candidates x 2 generations = 4
  eureka_generations: 2
  n_samples: 3 # Independent LLM seeds per experiment
  seed: 42

# LLM inference parameters
llm:
  model_id: "Qwen/Qwen2.5-Coder-7B-Instruct-AWQ"
  max_model_len: 6144
  temperature_gen: 0.95
  temperature_repair: 0.35
  max_tokens: 900
  gpu_memory_utilization: 0.88
  tensor_parallel_size: 2

# DP Solver parameters
dp_solver:
  gamma: 1.0
  eps_hack: 1.0e-6
  eps_margin_rel: 0.01

# GateKeeper verification parameters
gatekeeper:
  g2_mode: "merge" # "hard" | "merge" | "soft"
  eps_signal_rel: 0.02
  eps_signal_abs: 1.0e-3
  rho_threshold: 0.75 # Minimum Spearman rank correlation with progress
  pool_max: 40
  stall_k: 2
  max_invariants: 8
  m_ce_per_round: 2
  attacker_mode: "dp"

# RL Probe parameters (Tabular Q-learning)
rl_probe:
  short_episodes: 1000 # Gate 5 fast probe
  short_seeds: 2
  tail_threshold: 0.50
  full_episodes: 2500 # Post-hoc Oracle evaluation
  full_seeds: 5
  alpha: 0.35
  optimistic_init: 1.0
  alpha_decay: true

# Trajectory generation seeds
stream_seeds:
  ce_seed: 1000
  signal_seed: 2000
  eval_seed: 3000
  probe_seed_base: 100
  final_eval_seed_base: 9000
